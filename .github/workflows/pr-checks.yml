name: Pull request checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YARN_NODE_LINKER: node-modules
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Typecheck, format, lint, unit tests and build
        run: yarn test
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Keyboard, touch, history and responsive browser checks
        run: |
          yarn preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/cubetimer365-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          yarn browser-check
      - name: Configured Cloudflare beacon browser checks
        run: yarn browser-analytics-fixture
